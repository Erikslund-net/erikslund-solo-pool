# yaml-language-server: $schema=./pool.schema.json
bitcoin_nodes:
  - address: bitcoind:8332
    username: erikslund
    password: CHANGE_ME_before_deploying
api_listen:
  - 127.0.0.1:7777
stratum_listen:
  - 0.0.0.0:3333
# Required by the optional TLS sidecar to preserve miner addresses.
# proxy_protocol_from: [127.0.0.1]
initial_difficulty: 10000
# The network ceiling takes precedence when it falls below this minimum.
minimum_difficulty: 1
# extranonce1_size: 6
# extranonce1_prefix: "0001"
# Must be persistent and writable; also stores the startup work-generation counter.
stats_directory: stats
zmq_block_endpoint: tcp://bitcoind:28332
