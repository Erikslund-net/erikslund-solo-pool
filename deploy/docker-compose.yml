# Keep this project name stable for existing deployment automation.
name: erikslund-pool-cpp-external

services:
  pool:
    network_mode: host
    build:
      context: ..
      dockerfile: Dockerfile
    image: erikslund-pool:latest
    restart: unless-stopped
    stop_grace_period: 2m
    user: "1000:1000"
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    read_only: true
    tmpfs: ["/tmp"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - --config
      - /etc/erikslund-pool/pool.yml
      - --log-file
      - /var/log/erikslund-pool/pool.log
    volumes:
      - /tmp/ipc:/tmp/ipc
      - /opt/erikslund-pool/etc/:/etc/erikslund-pool/:ro
      - /opt/erikslund-pool/data/:/var/lib/erikslund-pool/
      - /opt/erikslund-pool/logs/:/var/log/erikslund-pool/
